[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "delayed_rm"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 5 - Production/Stable",
]
keywords = ["rm"]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
description = "Ever wish you had a few minutes to undo an rm? Now you do!"
urls = {Homepage = "https://github.com/zwimer/delayed_rm"}
requires-python = ">= 3.12"
dynamic = ["version"]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.scripts]
delayed_rm = "delayed_rm:cli"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages]
find = {namespaces = false}

[tool.setuptools.package-data]
delayed_rm = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "delayed_rm.__version__"}

# Tools

[tool.pylint]
disable = [
	"missing-module-docstring",
	"too-many-arguments",
	"line-too-long"
]
[tool.pylint.main]
jobs = 0

[tool.black]
line-length = 120
target-version = ["py312", "py313", "py314", "py315"]

[tool.ruff]
line-length = 120
[tool.ruff.lint]
ignore=[
	"D10", "D2", "D403", "D415",
	"DTZ005",
	"E731", "E741",
	"I001",
	"PLR0912", "PLR0913", "PLR0915", "PLR2004",
	"S603",
]
extend-select = [
	"ANN",
	"ARG",
	"ASYNC",
	"C4",
	"D",
	"DTZ",
	"PERF",
	"PGH",
	"PIE",
	"PL",
	"PTH",
	"RET",
	"S",
	"SIM",
	"TID"
]
[tool.ruff.lint.pydocstyle]
convention = "google"
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.bandit]
skips = ["B404"]

[tool.vulture]
ignore_names = ["cli"]
paths = ["delayed_rm"]
